[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "osint-agent"
version = "0.1.0"
description = "Modular OSINT agent for authorized investigations: email, username and phone enrichment"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Anwar" }]
requires-python = ">=3.12"
dependencies = [
    "httpx",
    "pydantic>=2",
    "typer",
    "rich",
    "python-dotenv",
    "dnspython",
    "phonenumbers",
    "holehe",
    "maigret",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "respx", "ruff", "pre-commit"]

[project.scripts]
osint = "osint_agent.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["osint_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Typer requires call-in-default for options.
"osint_agent/cli.py" = ["B008"]
